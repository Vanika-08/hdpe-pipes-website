<div class="datasheet-modal" id="quoteModal">
  <div class="datasheet-overlay"></div>

  <div class="datasheet-box">
    <div class="datasheet-header">
      <h3>Request a call back</h3>

      <button class="close-modal">&times;</button>
    </div>

    <div class="datasheet-body">
      <div class="form-group">
        <input type="text" placeholder="Full Name" />
      </div>

      <div class="form-group">
        <input type="text" placeholder="Company Name" />
      </div>

      <div class="form-group">
        <input type="email" placeholder="Email Address" required/>
      </div>

      <div class="phone-field">
        <select>
          <option>+91</option>
          <option>+1</option>
        </select>

        <input type="tel" placeholder="7003026616" />
      </div>
    </div>

    <div class="datasheet-footer">
      <button class="download-btn active">Submit Form</button>
    </div>
  </div>
</div>
