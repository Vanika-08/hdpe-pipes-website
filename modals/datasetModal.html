<!-- ===== Datasheet Modal ===== -->

<div class="datasheet-modal" id="datasheetModal">
  <div class="datasheet-overlay"></div>

  <div class="datasheet-box">
    <!-- Header -->
    <div class="datasheet-header">
      <h3>Let us email the entire catalogue to you</h3>

      <button class="close-modal" id="closeDatasheetModal">×</button>
    </div>

    <!-- Body -->
    <div class="datasheet-body">
      <div class="form-group">
        <label>Your Email *</label>

        <input type="email" placeholder="example@gmail.com" />
      </div>

      <div class="form-group">
        <label>Your Contact (Optional)</label>

        <input type="text" placeholder="+91-0000000000" />
      </div>
    </div>

    <!-- Footer -->
    <div class="datasheet-footer">
      <button class="download-btn">Download Brochure</button>
    </div>
  </div>
</div>
